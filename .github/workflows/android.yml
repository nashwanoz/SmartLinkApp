name: Build Android APK

on:
  push:
    branches:
      - main # أو master حسب اسم الفرع الرئيسي لديك

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Project and Sync Capacitor
        run: npm run static-build

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android
          
      - name: Adjust Android SDK Versions for Android 9.0+
        run: |
          # ضبط الحد الأدنى للتشغيل ليدعم أندرويد 9.0 فما فوق (API 28)
          sed -i 's/minSdkVersion = .*/minSdkVersion = 28/g' android/variables.gradle
          # ضبط الإصدار المستهدف للتوافق مع معايير جوجل بلاي لعام 2026 (API 36)
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/g' android/variables.gradle

      - name: Build Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-app-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
